name: Checks
on:
  push:
    branches: [main, feature/sonora-accounts-recommendations-imports]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.profile-speed.config.ts
      - run: npx playwright test --config playwright.row-local.config.ts tests/row-local.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-results
          path: .sonora/test-results/
          retention-days: 7
